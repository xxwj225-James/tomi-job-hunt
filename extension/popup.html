<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>TomiHunt</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
        font-size: 13px;
        color: #222;
      }
      h1 { font-size: 16px; margin: 0 0 4px; }
      .sub { color: #888; margin-bottom: 12px; }
      .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
      .ok { color: #1a7f37; font-weight: 600; }
      .down { color: #c0392b; font-weight: 600; }
      .tip { margin-top: 12px; padding: 10px; background: #f6f8ff; border-radius: 8px; line-height: 1.6; }
      code { background: #eef; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>🤖 TomiHunt</h1>
    <div class="sub">AI 求职雷达 · 数据不出本机</div>
    <div id="status">连接中…</div>
    <div class="tip">
      在 <b>Boss 直聘</b> / <b>猎聘</b> 岗位详情页，右下角会出现
      <b>🤖 TomiHunt</b> 浮动按钮：自动导入 JD → AI 结构化标签 →
      生成打招呼语 → 一键填入聊天框。<br /><br />
      首次使用请点击下方「⚙️ 设置」，粘贴一个 API Key（DeepSeek / Kimi /
      Qwen / Claude 任选）——<b>无需启动任何本地服务</b>。<br /><br />
      进阶功能（语义搜索/看板/岗位雷达）需运行本地 Core：下载项目后双击
      <code>start.bat</code> 即可。
    </div>
    <div style="margin-top:10px">
      <button id="open-options" style="width:100%;padding:9px;border:0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#4f7cff,#6a5cff)">⚙️ 设置（粘贴 API Key）</button>
    </div>
    <div style="margin-top:10px">
      <button id="start-core" style="width:100%;padding:9px;border:1px solid #4f7cff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#4f7cff;background:#fff">🚀 启动完整模式（一键启动本地 Core）</button>
      <div id="core-hint" style="margin-top:6px;font-size:11px;color:#888;line-height:1.5;display:none"></div>
    </div>
    <div id="update-hint" style="margin-top:10px;padding:8px;background:#fff7ed;border-radius:8px;color:#b25e00;font-size:12px;display:none"></div>
    <div style="margin-top:8px;font-size:11px;color:#999;text-align:center">
      开源免费 · <a href="https://github.com/xxwj225-James/tomi-job-hunt/blob/main/docs/support.md" target="_blank" style="color:#4f7cff">支持项目</a>
    </div>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
